openapi: 3.1.0
info:
  title: Notifier API
  version: 1.0.0
  description: |
    The app's way to connect Telegram chats to a tenant. Every request
    except /v1/health needs `Authorization: Bearer <NOTIFIER_API_TOKEN>`.
security:
  - token: []
paths:
  /v1/health:
    get:
      summary: Whether the notifier and its database answer
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        "503": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}/links:
    parameters:
      - $ref: "#/components/parameters/tenant"
    post:
      summary: A one-time link that connects a Telegram chat to the tenant
      description: Opening the link in Telegram connects that chat. It works once, for 10 minutes.
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}/chats:
    parameters:
      - $ref: "#/components/parameters/tenant"
    get:
      summary: The chats connected to the tenant
      responses:
        "200":
          description: Chats, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [chats]
                properties:
                  chats:
                    type: array
                    items: {$ref: "#/components/schemas/Chat"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}/chats/{chat}:
    parameters:
      - $ref: "#/components/parameters/tenant"
      - name: chat
        in: path
        required: true
        schema: {type: integer, format: int64}
    delete:
      summary: Disconnect a chat
      description: Nothing more is sent to the chat. Its commands are refused until it connects again.
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
  parameters:
    tenant:
      name: tenant
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum: [bad_request, unauthorized, not_found, internal]
                  message: {type: string}
  schemas:
    Chat:
      type: object
      required: [chat_id, name, linked_at]
      properties:
        chat_id: {type: integer, format: int64}
        name: {type: string, description: The Telegram user's @username or first name.}
        linked_at: {type: string, format: date-time}
